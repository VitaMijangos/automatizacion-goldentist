<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GolDentist · Ventas</title>
<style>
  :root{
    color-scheme: light;
    --surface-1:#fcfcfb; --page:#f9f9f7; --card:#ffffff;
    --text-primary:#0b0b0b; --text-secondary:#52514e; --text-muted:#898781;
    --grid:#e1e0d9; --axis:#c3c2b7; --border:rgba(11,11,11,0.10);
    --accent:#0268d3; --accent-2:#eb6834;
    --brand-cyan:#00c2e0; --brand-blue:#0268d3;
    --good:#0ca30c; --danger:#d03b3b; --warn:#eda100;
    --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a; --s4:#eda100;
    --s5:#e87ba4; --s6:#008300; --s7:#4a3aa7; --s8:#e34948;
    --seq-100:#cde2fb; --seq-250:#86b6ef; --seq-400:#3987e5; --seq-550:#1c5cab; --seq-700:#0d366b;
    --radius:14px; --radius-sm:9px;
  }
  /* Fondo blanco fijo: esta app siempre usa el tema claro, sin importar el modo
     oscuro del sistema operativo del dispositivo (a petición del usuario). */
  *{box-sizing:border-box;}
  body{margin:0;background:var(--page);color:var(--text-primary);
    font-family: system-ui,-apple-system,"Segoe UI",sans-serif; -webkit-font-smoothing:antialiased;
    font-size:17px;}
  #root{max-width:1440px;margin:0 auto;padding:26px 20px 80px;}
  header.topbar{display:flex;align-items:center;justify-content:space-between;gap:14px;margin-bottom:24px;flex-wrap:wrap;}
  .brand{display:flex;flex-direction:column;gap:6px;}
  .brand-logo{height:56px;width:auto;display:block;}
  .brand p{margin:0;font-size:16px;color:var(--text-secondary);}
  .adminbtn{border:1px solid var(--border);background:var(--card);color:var(--text-secondary);
    border-radius:999px;padding:12px 20px;font-size:16px;cursor:pointer;display:flex;align-items:center;gap:8px;}
  .adminbtn:hover{color:var(--text-primary);}
  .adminbtn.on{background:linear-gradient(135deg,var(--brand-cyan),var(--brand-blue));color:#fff;border-color:transparent;}
  .session-info{display:flex;align-items:center;gap:12px;flex-wrap:wrap;justify-content:flex-end;}
  .session-email{font-size:15px;color:var(--text-secondary);}
  .session-email .badge-admin{margin-left:8px;}
  #login-gate{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;}
  #login-gate[hidden],#root[hidden]{display:none;}
  .login-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);
    padding:32px;max-width:380px;width:100%;text-align:center;}
  .login-card .brand-logo{height:56px;width:auto;display:block;margin:0 auto 18px;}
  .login-card h2{margin:0 0 8px;font-size:22px;}
  .login-card .hint{margin:0 0 22px;}
  .login-card .field{text-align:left;}
  .login-card .btn{width:100%;margin-top:6px;}
  nav.tabs{display:flex;gap:8px;margin-bottom:24px;border-bottom:1px solid var(--grid);flex-wrap:wrap;}
  nav.tabs button{appearance:none;border:none;background:none;padding:14px 18px;font-size:17px;
    color:var(--text-secondary);cursor:pointer;border-bottom:3px solid transparent;font-weight:600;}
  nav.tabs button.active{color:var(--text-primary);border-bottom-color:var(--accent);}
  .view{display:none;}
  .view.active{display:block;}
  .card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:24px;margin-bottom:20px;}
  .card h2{font-size:20px;margin:0 0 18px;font-weight:700;}
  .card h3{font-size:15px;margin:0 0 12px;font-weight:700;color:var(--text-secondary);text-transform:uppercase;letter-spacing:.03em;}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px;}
  .grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:16px;}
  .field{display:flex;flex-direction:column;gap:8px;margin-bottom:18px;}
  .field label{font-size:15px;color:var(--text-secondary);font-weight:600;}
  .field input,.field select{
    font-size:18px;padding:14px 16px;border-radius:var(--radius-sm);border:1px solid var(--border);
    background:var(--surface-1);color:var(--text-primary);width:100%;font-family:inherit;}
  .field input:focus,.field select:focus{outline:2px solid var(--accent);outline-offset:1px;}
  .row{display:flex;gap:14px;flex-wrap:wrap;align-items:flex-end;}
  .btn{appearance:none;border:none;border-radius:999px;padding:15px 26px;font-size:17px;font-weight:700;
    cursor:pointer;background:linear-gradient(135deg,var(--brand-cyan),var(--brand-blue));color:#fff;}
  .btn:hover{filter:brightness(1.06);}
  .btn.secondary{background:var(--surface-1);color:var(--text-primary);border:1px solid var(--border);}
  .btn.danger{background:var(--danger);color:#fff;}
  .btn:disabled{opacity:.5;cursor:not-allowed;}
  .btn.small{padding:9px 16px;font-size:15px;}
  table{width:100%;border-collapse:collapse;font-size:16px;}
  th{text-align:left;color:var(--text-muted);font-weight:600;font-size:13.5px;text-transform:uppercase;
    letter-spacing:.03em;padding:9px 10px;border-bottom:1px solid var(--grid);}
  td{padding:13px 10px;border-bottom:1px solid var(--grid);color:var(--text-primary);}
  tr:last-child td{border-bottom:none;}
  /* Mensajes tiene 9 columnas de datos + Coincide + acciones — más angostas
     y compactas que el resto de las tablas de la app (encabezados sin
     mayúsculas extendidas, botones de acción como iconos) para que quepan
     sin tener que deslizar horizontalmente en la mayoría de las pantallas. */
  .msg-table{font-size:14px;}
  .msg-table th{padding:8px 4px;font-size:11px;letter-spacing:0;}
  .msg-table td{padding:9px 4px;}
  .msg-table td.msg-coincide{text-align:center;font-size:15px;}
  .msg-table .pill{font-size:13.5px;gap:5px;}
  .msg-table .swatch{width:9px;height:9px;}
  .msg-table .btn.small{padding:6px 9px;font-size:15px;line-height:1;}
  /* Barra de scroll horizontal duplicada arriba de la tabla, sincronizada
     con la de abajo — así se puede deslizar a la derecha sin tener que
     bajar hasta el final de la tabla para encontrar el scrollbar. */
  .msg-scroll-top{overflow-x:auto;overflow-y:hidden;height:14px;margin-bottom:4px;}
  .msg-scroll-top-inner{height:1px;}
  .msg-scroll-bottom{overflow-x:auto;}
  .muted{color:var(--text-muted);}
  .pill{display:inline-flex;align-items:center;gap:7px;font-size:15px;color:var(--text-secondary);}
  .swatch{width:12px;height:12px;border-radius:3px;flex:none;}
  .stat-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:20px;}
  .stat{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:20px 22px;}
  .stat .label{font-size:15px;color:var(--text-secondary);margin-bottom:8px;}
  .stat .value{font-size:34px;font-weight:700;line-height:1.1;}
  .stat .sub{font-size:14px;color:var(--text-muted);margin-top:6px;}
  .filters{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:20px;align-items:flex-end;}
  .filters .field{margin-bottom:0;min-width:170px;}
  .bar-row{display:flex;align-items:center;gap:12px;margin-bottom:13px;}
  .bar-row .cat{width:170px;flex:none;font-size:15px;color:var(--text-secondary);text-align:right;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .bar-track{flex:1;display:flex;align-items:center;min-width:0;height:28px;}
  .bar-fill{height:28px;border-radius:5px;flex:0 0 auto;min-width:4px;transition:width .25s;cursor:default;}
  .bar-val{margin-left:10px;font-size:15px;color:var(--text-primary);font-weight:600;white-space:nowrap;flex:none;}
  .heat-table{overflow-x:auto;}
  .heat-table table{min-width:520px;}
  .heat-cell{text-align:center;font-variant-numeric:tabular-nums;border-radius:4px;}
  .toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--text-primary);
    color:var(--page);padding:13px 22px;border-radius:999px;font-size:16px;font-weight:600;
    box-shadow:0 6px 20px rgba(0,0,0,.2);opacity:0;pointer-events:none;transition:opacity .2s, transform .2s;z-index:50;}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(-4px);}
  .modal-backdrop{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:center;
    justify-content:center;z-index:60;padding:16px;}
  .modal{background:var(--card);border-radius:var(--radius);padding:28px;max-width:400px;width:100%;
    border:1px solid var(--border);max-height:calc(100vh - 48px);overflow-y:auto;}
  .modal h3{margin:0 0 14px;font-size:20px;}
  .modal .err{color:var(--danger);font-size:15px;margin-top:8px;min-height:18px;}
  .empty{color:var(--text-muted);font-size:16px;padding:20px 0;text-align:center;}
  .catlist{display:flex;flex-direction:column;gap:0;margin-bottom:10px;}
  .catlist .item{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--grid);}
  .catlist .item:last-child{border-bottom:none;}
  .catlist .item .name{flex:1;font-size:17px;}
  .badge{font-size:13px;padding:3px 10px;border-radius:999px;background:var(--surface-1);color:var(--text-muted);}
  .hint{font-size:14.5px;color:var(--text-muted);margin-top:6px;}
  ::placeholder{color:var(--text-muted);}
  @media (max-width:640px){
    .stat-grid{grid-template-columns:1fr 1fr;}
    .grid2{grid-template-columns:1fr;}
    .grid3{grid-template-columns:1fr 1fr;}
    .bar-row .cat{width:110px;}
    .brand-logo{height:44px;}
  }
</style>
